<!DOCTYPE html>
<html lang="en"> <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    
    <link rel="stylesheet" href="../.local/state/haku_theme/newtab.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            background: transparent !important;
            background-color: transparent !important;
            
            font-family: var(--font_family), 'Courier New', Courier, monospace;
            
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        .clock-container {
            text-align: center;
            padding: 20px;
        }
        .time {
            font-size: 10.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            
            color: color-mix(in srgb, var(--accent_color, #ffffff) 60%, transparent); 
            
            text-shadow: 
                0 0 8px color-mix(in srgb, var(--accent_color, #ffffff) 35%, transparent), 
                0 0 2px rgba(0, 0, 0, 0.5); 
        }
        .date {
            font-size: 1.5rem;
            margin-top: 10px;
            letter-spacing: 3px;
            
            color: color-mix(in srgb, var(--accent_color, #ffffff) 60%, transparent);
            text-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
            text-transform: capitalize;
        }
    </style>
</head>
<body>

    <div class="clock-container">
        <div class="time" id="clock">00:00</div>
        <div class="date" id="date">YYYY-MM-DD</div>
    </div>

    <script>
        const userLocale = navigator.language || "en-US";
        document.documentElement.lang = userLocale;

        function updateClock() {
            const now = new Date();
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}`;
            
            const options = { 
                weekday: 'short', 
                year: 'numeric', 
                month: '2-digit', 
                day: '2-digit' 
            };
            
            const localizedDate = new Intl.DateTimeFormat(userLocale, options).format(now);
            
            document.getElementById('date').textContent = localizedDate;
        }
        
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
