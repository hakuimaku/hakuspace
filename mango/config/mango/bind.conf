# DO NOT EDIT THIS FILE, EDIT ~/hakuspace-control/mango-custom.conf INSTEAD

# Hotkey Bindings
bind=SUPER+ALT,R,reload_config
bind=SUPER+SHIFT,E,quit

# Custom Application Bindings
bind=SUPER,Q,spawn,kitty
bind=SUPER,R,spawn,rofi -show drun
bind=SUPER,B,spawn,firefox
bind=SUPER,C,killclient,
bind=SUPER,E,spawn,thunar
bind=SUPER,N,spawn,swaync-client -t -sw

bind=SUPER,P,spawn,$HOME/.local/bin/screenshot.sh
bind=SUPER+SHIFT,P,spawn,$HOME/.local/bin/screenshot.sh --fullscreen

bind=SUPER,TAB,spawn,$HOME/.local/bin/hakumenu.sh
bind=SUPER+SHIFT,Y,spawn,$HOME/.local/bin/wallpaper_video_select.sh
bind=SUPER+SHIFT,V,spawn,$HOME/.local/bin/clipboard_menu.sh --wipe
bind=SUPER,V,spawn,$HOME/.local/bin/clipboard_menu.sh
bind=SUPER,Y,spawn,$HOME/.local/bin/wallpaper_select.sh
bind=SUPER,F11,spawn,$HOME/.local/bin/record.sh
bind=SUPER,T,spawn,$HOME/.local/bin/cava_manager.sh --toggle
bind=SUPER+SHIFT,W,spawn,$HOME/.local/bin/waybar_manager.sh --cycle
bind=SUPER,W,spawn,$HOME/.local/bin/dockbar_manager.sh --toggle 
bind=SUPER,L,spawn,$HOME/.local/bin/nightlight_toggle.sh

bind=SUPER,SLASH,spawn,rofi -modi emoji -show emoji

# switch window status
bind=SUPER,G,toggleglobal,
bind=ALT,TAB,toggleoverview,0
bind=SUPER,Z,togglefloating,
bind=SUPER,F,togglemaximizescreen,
bind=SUPER+SHIFT,F,togglefullscreen,
bind=ALT+SHIFT,F,togglefakefullscreen,
bind=SUPER,X,toggleoverlay,

# Scratchpad
bind=SUPER,I,minimized
bind=SUPER,GRAVE,toggle_scratchpad
bind=SUPER+SHIFT,I,restore_minimized

# Window Management Bindings
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

bind=SUPER,A,focusdir,left
bind=SUPER,S,focusdir,right

# swap window
bind=ALT+SHIFT,Up,exchange_client,up
bind=ALT+SHIFT,Down,exchange_client,down
bind=ALT+SHIFT,Left,exchange_client,left
bind=ALT+SHIFT,Right,exchange_client,right

bind=SUPER+SHIFT,A,exchange_client,left
bind=SUPER+SHIFT,S,exchange_client,right

# scroller layout
bind=SUPER,D,switch_proportion_preset,
bind=SUPER+CTRL,Left,scroller_stack,left
bind=SUPER+CTRL,Right,scroller_stack,right
bind=SUPER+CTRL,Up,scroller_stack,up
bind=SUPER+CTRL,Down,scroller_stack,down

# resizewin
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# monitor switch
bind=SUPER+SHIFT,Left,focusmon,left
bind=SUPER+SHIFT,Right,focusmon,right
bind=SUPER+SHIFT,Up,focusmon,up
bind=SUPER+SHIFT,Down,focusmon,down
bind=SUPER+ALT,Left,tagmon,left
bind=SUPER+ALT,Right,tagmon,right
bind=SUPER+ALT,Up,tagmon,up
bind=SUPER+ALT,Down,tagmon,down

# Mouse Button Bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=SUPER+CTRL,btn_middle,togglefullscreen

# Axis Bindings
axisbind=SUPER,UP,viewtoleft,0
axisbind=SUPER,DOWN,viewtoright,0
axisbind=SUPER+SHIFT,UP,focusdir,left
axisbind=SUPER+SHIFT,DOWN,focusdir,right
axisbind=CTRL+SUPER,UP,exchange_client,left
axisbind=CTRL+SUPER,DOWN,exchange_client,right

# Gesturebind
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,left,4,viewtoleft_have_client
gesturebind=none,right,4,viewtoright_have_client
gesturebind=none,up,4,toggleoverview,1
gesturebind=none,down,4,toggleoverview,1

# brightness and volume
bind=none,XF86AudioRaiseVolume,spawn,~/.config/mango/scripts/volume.sh up
bind=none,XF86AudioLowerVolume,spawn,~/.config/mango/scripts/volume.sh down
bind=none,XF86MonBrightnessUp,spawn,~/.config/mango/scripts/brightness.sh up
bind=none,XF86MonBrightnessDown,spawn,~/.config/mango/scripts/brightness.sh down
