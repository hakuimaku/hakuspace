exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once=systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once=/usr/lib/mate-polkit/polkit-mate-authentication-agent-1
exec-once=awww-daemon
exec-once=swaync
exec-once=hypridle
exec-once=fcitx5 -d
exec-once=wl-paste --type text --watch cliphist store
exec-once=wl-paste --type image --watch cliphist store
exec-once=nm-applet --indicator
exec-once=blueman-applet
exec-once=sway-audio-idle-inhibit

exec-once=$HOME/.local/bin/dockbar_manager.sh --startup # Run dockbar if state is true
exec-once=$HOME/.local/bin/desktop_icons_manager.sh --startup # Run desktop icons if state is true
exec-once=$HOME/.local/bin/waybar_manager.sh # Run waybar
exec-once=$HOME/.local/bin/welcome.sh