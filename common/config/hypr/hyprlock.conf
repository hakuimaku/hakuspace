# Reference: https://github.com/mahaveergurjar/Hyprlock-Dots
# Thanks to @mahaveergurjar for the original config and inspiration

# █ █ █▄█ █▀█ █▀█ █   █▀█ █▀▀ █▄▀
# █▀█  █  █▀▀ █▀▄ █▄▄ █▄█ █▄▄ █ █

source = ~/.local/state/haku_theme/hyprland-style.conf

# GENERAL
general {
    hide_cursor = true
    ignore_empty_input = true
    text_trim = true
}

# BACKGROUND
background {
    monitor = 
    path = screenshot
    blur_passes = 2
    contrast = 1.2
    brightness = 0.7172
    vibrancy = 0.1696
    vibrancy_darkness = 0
}


# TIME HR
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%H")"
    color = $accent_color
    shadow_size = 3
    shadow_color = rgb(0,0,0)
    shadow_boost = 1.4
    font_size = 130
    font_family = $font_family extraBold
    position = 0, -280
    halign = center
    valign = top
    zindex = 5
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%M")"
    color = rgba(255, 255, 255, 0.8)
    font_size = 130
    font_family = $font_family extraBold
    position = 0, -450
    halign = center
    valign = top
    zindex = 5
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%d %b %A")"
    color = $accent_color
    font_size = 14
    font_family = $font_family extraBold
    position = 0, -130
    halign = center
    valign = center
    zindex = 5
}

# USER (TOP)
label {
    monitor =
    text = Hi there, $USER
    color = $accent_color
    font_size = 20
    font_family = $font_family extraBold
    position = 0, 500
    halign = center
    valign = center
    zindex = 5
}


# INPUT FIELD
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 0
    outer_color = $accent_color
    dots_size = 0.4
    dots_spacing = 0.2
    dots_center = true
    inner_color = rgba(255, 255, 255, 0.05)
    font_color = $accent_color
    fade_on_empty = false
    placeholder_text = <i> Use Me ;) </i>
    hide_input = false
    fail_color = rgba(204, 34, 34, 0.5)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position = 0, -220
    halign = center
    valign = center
    zindex = 20
}

# BOX (CENTER)
shape {
    monitor =
    size = 420, 640
    color = rgba(0, 0, 0, 0.2)
    rounding = 64
    position = 0, 0
    halign = center
    valign = center
}

#
label {
    monitor =
    text = Have a nice day!
    color = $accent_color
    font_size = 20
    font_family = $font_family extraBold
    position = 0, -500
    halign = center
    valign = center
    zindex = 5
}
