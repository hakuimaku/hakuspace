# HakuSpace Classic Retro Hyprlock Configuration

source = ~/.local/state/hakuspace/theme/hyprland-style.conf

# Fallback Classic palette tokens (08-gray) in case generated palette is absent
$desktop_bg = rgb(54, 54, 54)
$window_bg = rgb(87, 87, 87)
$panel_bg = rgb(71, 71, 71)
$inset_bg = rgb(43, 43, 43)
$title_bg = rgb(106, 106, 106)
$title_fg = rgb(247, 247, 247)
$text = rgb(237, 237, 237)
$text_muted = rgb(215, 215, 215)
$text_mono = rgb(215, 215, 215)
$border_light = rgb(143, 143, 143)
$border_dark = rgb(26, 26, 26)
$border_frame = rgb(15, 15, 15)
$button_bg = rgb(97, 97, 97)
$button_fg = rgb(237, 237, 237)
$select_bg = rgb(184, 184, 184)
$urgent_bg = rgb(149, 35, 35)

source = ~/.local/state/hakuspace/theme/classic/hyprlock-palette.conf

# Fallback labels (evaluated top-to-bottom before widget blocks)
$top_label = Hi there, $USER
$bottom_label = Have a nice day!
$input_placeholder = <i> Use Me ;) </i>

source = ~/hakucfg/config/hyprlock.conf

general {
    hide_cursor = true
    ignore_empty_input = true
    text_trim = true
}

background {
    monitor =
    color = $desktop_bg
}

# Main dialog window (40% x 46% centered -> 30% L/R margins, 27% T/B margins)
shape {
    monitor =
    size = 40%, 46%
    color = $window_bg
    rounding = 0
    border_size = 2
    border_color = $border_frame
    position = 0%, 0%
    halign = center
    valign = center
    zindex = 1
}

# Raised 2px window bevel: light on top/left, dark on right/bottom
shape {
    monitor =
    size = 40%, 2
    color = $border_light
    rounding = 0
    position = 0%, -27%
    halign = center
    valign = top
    zindex = 4
}

shape {
    monitor =
    size = 2, 46%
    color = $border_light
    rounding = 0
    position = 30%, 0%
    halign = left
    valign = center
    zindex = 4
}

shape {
    monitor =
    size = 2, 46%
    color = $border_dark
    rounding = 0
    position = -30%, 0%
    halign = right
    valign = center
    zindex = 5
}

shape {
    monitor =
    size = 40%, 2
    color = $border_dark
    rounding = 0
    position = 0%, 27%
    halign = center
    valign = bottom
    zindex = 5
}

# Titlebar (top 27.6%..31.4%, vertical center +20.5% from screen center)
shape {
    monitor =
    size = 39%, 3.8%
    color = $title_bg
    rounding = 0
    position = 0%, -27.6%
    halign = center
    valign = top
    zindex = 3
}

label {
    monitor =
    text = LOG ON TO HAKUSPACE
    color = $title_fg
    font_size = 12
    font_family = $font_family Bold
    position = 31.2%, 20.5%
    halign = left
    valign = center
    zindex = 6
}

# Titlebar window buttons: _ [] X
shape {
    monitor =
    size = 1.4%, 2.5%
    color = $button_bg
    rounding = 0
    border_size = 1
    border_color = $border_light
    position = 14.7%, 20.5%
    halign = center
    valign = center
    zindex = 6
}

label {
    monitor =
    text = _
    color = $button_fg
    font_size = 11
    font_family = $font_family Bold
    position = 14.7%, 20.5%
    halign = center
    valign = center
    zindex = 7
}

shape {
    monitor =
    size = 1.4%, 2.5%
    color = $button_bg
    rounding = 0
    border_size = 1
    border_color = $border_light
    position = 16.5%, 20.5%
    halign = center
    valign = center
    zindex = 6
}

label {
    monitor =
    text = □
    color = $button_fg
    font_size = 11
    font_family = $font_family Bold
    position = 16.5%, 20.5%
    halign = center
    valign = center
    zindex = 7
}

shape {
    monitor =
    size = 1.4%, 2.5%
    color = $button_bg
    rounding = 0
    border_size = 1
    border_color = $border_light
    position = 18.3%, 20.5%
    halign = center
    valign = center
    zindex = 6
}

label {
    monitor =
    text = X
    color = $button_fg
    font_size = 11
    font_family = $font_family Bold
    position = 18.3%, 20.5%
    halign = center
    valign = center
    zindex = 7
}

# Sunken panel body
shape {
    monitor =
    size = 39%, 40.2%
    color = $panel_bg
    rounding = 0
    border_size = 2
    border_color = $border_dark
    position = 0%, -2.2%
    halign = center
    valign = center
    zindex = 2
}

# Clock and date inset display
shape {
    monitor =
    size = 36%, 15.5%
    color = $inset_bg
    rounding = 0
    border_size = 2
    border_color = $border_dark
    position = 0%, 8.8%
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M:%S"
    color = $text
    font_size = 42
    font_family = $font_family Bold
    position = 0%, 10.6%
    halign = center
    valign = center
    zindex = 6
}

label {
    monitor =
    text = cmd[update:1000] date +"%a · %d %b %Y" | tr '[:lower:]' '[:upper:]'
    color = $text_mono
    font_size = 12
    font_family = $font_family
    position = 0%, 3.6%
    halign = center
    valign = center
    zindex = 6
}

# User label
label {
    monitor =
    text = $top_label
    color = $text_muted
    font_size = 13
    font_family = $font_family Bold
    position = 0%, -1.8%
    halign = center
    valign = center
    zindex = 6
}

# Inset password field
input-field {
    monitor =
    size = 36%, 5.8%
    outline_thickness = 2
    outer_color = $border_dark
    inner_color = $inset_bg
    font_color = $text
    font_family = $font_family
    dots_size = 0.35
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = 0
    fade_on_empty = false
    placeholder_text = $input_placeholder
    hide_input = false
    check_color = $select_bg
    fail_color = $urgent_bg
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    rounding = 0
    position = 0%, -7.6%
    halign = center
    valign = center
    zindex = 10
}

# Bottom status inset
shape {
    monitor =
    size = 36%, 4.6%
    color = $inset_bg
    rounding = 0
    border_size = 2
    border_color = $border_dark
    position = 0%, -16.8%
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = $bottom_label
    color = $text_mono
    font_size = 12
    font_family = $font_family
    position = 0%, -16.8%
    halign = center
    valign = center
    zindex = 6
}
