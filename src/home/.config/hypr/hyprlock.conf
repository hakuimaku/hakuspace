# HakuSpace Classic Cassette Hyprlock Configuration

# Fallback font in case generated style file is absent
$font_family = monospace

source = ~/.local/state/hakuspace/theme/hyprland-style.conf

# Separate cassette color palette (independent from Classic 8-scheme / Hikai accent)
$cassette_desktop = rgb(24, 24, 27)
$cassette_ink = rgb(34, 31, 28)
$cassette_ink_muted = rgb(95, 88, 79)
$cassette_header_fg = rgb(235, 229, 216)
$cassette_window_bg = rgb(19, 18, 17)
$cassette_window_border = rgb(74, 69, 63)
$cassette_dots = rgb(214, 207, 193)
$cassette_check = rgb(156, 130, 89)
$cassette_fail = rgb(148, 76, 66)

# Fallback labels (evaluated top-to-bottom before widget blocks)
$top_label = Hi there, $USER
$bottom_label = Have a nice day!
$input_placeholder = <i> Use Me ;) </i>

source = ~/hakucfg/config/hyprlock.conf

general {
    hide_cursor = true
    ignore_empty_input = true
    text_trim = true
}

background {
    monitor =
    color = $cassette_desktop
}

# Pre-rendered from ~/.config/hypr/cassette.svg (Hyprlock v0.9.7 image widget does not load .svg directly)
image {
    monitor =
    path = ~/.config/hypr/cassette.png
    size = 576
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = 1
}

# Top label on terracotta cassette header band
label {
    monitor =
    text = $top_label
    color = $cassette_header_fg
    font_size = 16
    font_family = $font_family Bold
    position = 0, 220
    halign = center
    valign = center
    zindex = 5
}

# Clock and date on cream cassette sticker
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M:%S"
    color = $cassette_ink
    font_size = 42
    font_family = $font_family Bold
    position = 0, 132
    halign = center
    valign = center
    zindex = 5
}

label {
    monitor =
    text = cmd[update:1000] date +"%a · %d %b %Y" | tr '[:lower:]' '[:upper:]'
    color = $cassette_ink_muted
    font_size = 14
    font_family = $font_family
    position = 0, 94
    halign = center
    valign = center
    zindex = 5
}

# Password input centered inside the tape window between both spools
input-field {
    monitor =
    size = 298, 56
    outline_thickness = 2
    outer_color = $cassette_window_border
    inner_color = $cassette_window_bg
    font_color = $cassette_dots
    font_family = $font_family
    dots_size = 0.32
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1
    fade_on_empty = false
    placeholder_text = $input_placeholder
    hide_input = false
    check_color = $cassette_check
    fail_color = $cassette_fail
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    rounding = 10
    position = 0, 2
    halign = center
    valign = center
    zindex = 10
}

# Bottom status label on lower cassette sticker strip
label {
    monitor =
    text = $bottom_label
    color = $cassette_ink_muted
    font_size = 14
    font_family = $font_family
    position = 0, -97
    halign = center
    valign = center
    zindex = 5
}
