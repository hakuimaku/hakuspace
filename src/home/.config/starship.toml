add_newline = true

format = '''
$sudo$username$hostname$directory$git_branch$git_status$git_state$nix_shell$cmd_duration
$character'''

[sudo]
disabled = false
style = 'bold fg:black bg:red'
format = '[  sudo  ]($style)'

[character]
success_symbol = '[>](bold white) '
error_symbol = '[!](bold red) '

[username]
show_always = true
style_root = 'bold fg:black bg:red'
style_user = 'bold fg:black bg:white'
format = '[  $user@]($style)'

[hostname]
ssh_only = false
ssh_symbol = 'ssh:'
style = 'bold fg:black bg:white'
format = '[$ssh_symbol$hostname  ]($style)'

[directory]
style = 'bold fg:black bg:blue'
format = '[  $path  ]($style)'
truncation_length = 3
truncation_symbol = '../'

[git_branch]
symbol = 'git:'
style = 'fg:black bg:green'
format = '[  $symbol$branch  ]($style)'

[git_status]
style = 'bold fg:black bg:yellow'
format = '[  $all_status$ahead_behind  ]($style)'

[git_state]
style = 'bold fg:black bg:red'
format = '[  $state( $progress_current/$progress_total)  ]($style)'

[nix_shell]
symbol = 'nix:'
style = 'fg:black bg:purple'
format = '[  $symbol$state( \($name\))  ]($style)'

[cmd_duration]
min_time = 2000
style = 'fg:black bg:cyan'
format = '[  $duration  ]($style)'
