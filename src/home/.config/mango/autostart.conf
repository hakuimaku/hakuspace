# DO NOT EDIT THIS FILE, EDIT ~/hakucfg/wm/mango-custom.conf INSTEAD

exec_once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec_once=systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec_once=$HOME/.local/bin/polkit_start.sh
exec_once=$HOME/.local/bin/session_start.sh --early
exec_once=hypridle
exec_once=wl-paste --type text --watch cliphist store
exec_once=wl-paste --type image --watch cliphist store
exec_once=nm-applet --indicator
exec_once=blueman-applet
exec_once=fcitx5 -d

# Resume wallpaper on startup
exec_once=$HOME/.local/bin/wallpaper_resume.sh

exec_once=$HOME/.local/bin/rounded_screen_manager.sh --startup # Run rounded screen if state is true
exec_once=$HOME/.local/bin/edge_trigger_manager.sh --startup # Run edge trigger if state is true
exec_once=$HOME/.local/bin/taskbar_manager.sh --startup # Run taskbar if state is true
exec_once=$HOME/.local/bin/waybar_manager.sh # Run waybar
exec_once=$HOME/.local/bin/desktop_icons_manager.sh --startup # Run desktop icons if state is true

exec_once=$HOME/.local/bin/welcome.sh