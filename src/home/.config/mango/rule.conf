# DO NOT EDIT THIS FILE, EDIT ~/hakucfg/wm/mango-custom.conf INSTEAD

tag_rule=id:1,layout_name:scroller
tag_rule=id:2,layout_name:scroller
tag_rule=id:3,layout_name:scroller
tag_rule=id:4,layout_name:scroller
tag_rule=id:5,layout_name:scroller
tag_rule=id:6,layout_name:scroller
tag_rule=id:7,layout_name:scroller
tag_rule=id:8,layout_name:scroller
tag_rule=id:9,layout_name:scroller

# Animation for layers
layer_rule=animation_type_open:slide,layer_name:swaync-control-center
layer_rule=animation_type_close:slide,layer_name:swaync-control-center
layer_rule=no_shadow:1,layer_name:swaync-control-center

layer_rule=animation_type_open:slide,layer_name:rofi
layer_rule=animation_type_close:slide,layer_name:rofi

# Scroller layout: Default proportion
window_rule=scroller_proportion:1.0,app_id:zen
window_rule=scroller_proportion:1.0,app_id:app.zen_browser.zen
window_rule=scroller_proportion:1.0,app_id:firefox
window_rule=scroller_proportion:1.0,app_id:code
window_rule=scroller_proportion:1.0,app_id:com.microsoft.VSCode
window_rule=scroller_proportion:0.65,app_id:thunar

# Rules for hakuspace
window_rule=scroller_proportion:0.6,app_id:seycmd
window_rule=scroller_proportion:0.4,app_id:seyclock
window_rule=scroller_proportion:0.4,app_id:seylavat
window_rule=scroller_proportion:0.4,app_id:seycava

# Floating windows
window_rule=is_floating:1,title:Confirm to replace files*
window_rule=is_floating:1,title:File Operation Progress*

window_rule=is_floating:1,app_id:qs
window_rule=width:600,height:800,app_id:qs

# Taskbar rules
layer_rule=animation_type_open:slide,layer_name:dock*
layer_rule=animation_type_close:slide,layer_name:dock*
layer_rule=no_shadow:1,layer_name:dock*

# Desktop icons rules
window_rule=is_floating:1,app_id:desktop-icons,title:Rename
window_rule=width:300,height:100,app_id:desktop-icons,title:Rename
window_rule=is_floating:1,app_id:desktop-icons,title:Create*
window_rule=width:300,height:100,app_id:desktop-icons,title:Create*

# No shadow for rofi, cause it looks weird
layer_rule=no_shadow:1,layer_name:rofi