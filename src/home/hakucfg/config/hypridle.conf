# Custom timeouts for hypridle here
# Core hypridle.conf is still in ~/.config/hypr/hypridle.conf

# Timeout for dimming the screen (seconds) - 5 minutes
$timeout_dim = 300

# Timeout for locking the screen - 2 minutes after dim (7 minutes total)
$timeout_lock = 420

# Timeout for turning off the display (DPMS) - 2 minutes after lock (9 minutes total)
$timeout_dpms = 540

# Timeout for putting the machine to sleep - 10 minutes after DPMS (19 minutes total)
$timeout_suspend = 1140

# Condition retry timeout for idle_inhibit.sh
# More info: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/#conditional-timeouts
$condition_retry_timeout = 30