# DO NOT EDIT THIS FILE, EDIT ~/hakuspace-control/mango-custom.conf INSTEAD

# blur
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.2
blur_params_brightness = 0.8
blur_params_contrast = 1.4
blur_params_saturation = 1.6

# shadow
shadows = 1
layer_shadows = 1
shadow_only_floating=0
shadows_size = 12
shadows_blur = 24
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

# window border
border_radius=12
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=0.9